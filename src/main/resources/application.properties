spring.application.name=prolt-operations
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/Prolt_Operations?stringtype=unspecified}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:iex_sec_k9P2mX_2026}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Multi-Schema Migration
spring.flyway.enabled=true
spring.flyway.schemas=public,forecasting
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration

# Multipart limits (50MB matching Node multer)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# Custom Application Properties
app.jwt.secret=${JWT_SECRET:super_secret_jwt_key_for_development}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}
app.node-env=${NODE_ENV:development}
app.cors-origins=${CORS_ORIGIN:*}
app.run-scraper=${RUN_SCRAPER:false}
app.webhook-receivers=${WEBHOOK_RECEIVERS:}
app.webhook-secret=${WEBHOOK_SECRET:super_secret_webhook_token_123}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@iexdashboard.local}
app.admin.password=${ADMIN_PASSWORD:admin}
app.mail.from=${SMTP_FROM:no-reply@proltenergy.com}
app.accuweather-api-key=${ACCUWEATHER_API_KEY:}
app.iex-calculator-api-url=${IEX_CALCULATOR_API_URL:}
app.puppeteer-executable-path=${PUPPETEER_EXECUTABLE_PATH:/usr/bin/chromium}
app.starrocks.host=${STARROCKS_HOST:prolt-prod-starrocks.probussense.com}
app.starrocks.port=${STARROCKS_PORT:9030}
app.starrocks.user=${STARROCKS_USER:read_only_user}
app.starrocks.password=${STARROCKS_PASSWORD:Probus@123}
app.starrocks.database=${STARROCKS_DATABASE:prolt_hes_db}
app.redis-url=${REDIS_URL:redis://localhost:6379}

# Auth & OTP Configuration
# PARITY: Superadmin OTP backdoor and store fallback settings
app.auth.superadmin-otp-bypass.enabled=${SUPERADMIN_OTP_BYPASS_ENABLED:true}
app.auth.superadmin-otp-bypass.otp-value=${SUPERADMIN_OTP:749261}
app.auth.superadmin-otp-bypass.email=${SUPERADMIN_EMAIL:super.admin@probus.io}
app.auth.otp.allow-memory-fallback=${OTP_ALLOW_MEMORY_FALLBACK:true}

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
