spring.application.name=prolt-operations
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.exposure.exclude=heapdump,env,loggers,threaddump,beans,configprops,mappings
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Explicitly disable sensitive endpoints across all profiles
management.endpoint.env.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.threaddump.enabled=false

# Swagger / OpenAPI
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Datasource configuration (PostgreSQL)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${POSTGRES_USER:}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Multi-Schema Migration
spring.flyway.enabled=true
spring.flyway.schemas=public,forecasting
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}

# Multipart limits (50MB matching Node multer)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Tomcat Multipart & Part Count Limits (supports up to 200 files)
server.tomcat.max-part-count=250
server.tomcat.max-parameter-count=10000
server.tomcat.max-swallow-size=50MB

# Mail
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis
spring.data.redis.url=${REDIS_URL:}

# Custom Application Properties
app.jwt.secret=${JWT_SECRET:}
app.jwt.expires-in=${JWT_EXPIRES_IN:7d}
app.node-env=${NODE_ENV:development}
app.cors-origins=${CORS_ORIGIN:*}
app.run-scraper=${RUN_SCRAPER:false}
app.webhook-receivers=${WEBHOOK_RECEIVERS:}
app.webhook-secret=${WEBHOOK_SECRET:}
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.mail.from=${SMTP_FROM:no-reply@proltenergy.com}
app.accuweather-api-key=${ACCUWEATHER_API_KEY:}
app.iex-calculator-api-url=${IEX_CALCULATOR_API_URL:https://www.iexindia.com}
app.iex-calculator.connect-timeout=5000
app.iex-calculator.read-timeout=15000
app.puppeteer-executable-path=${PUPPETEER_EXECUTABLE_PATH:}
app.starrocks.host=${STARROCKS_HOST:}
app.starrocks.port=${STARROCKS_PORT:9030}
app.starrocks.user=${STARROCKS_USER:}
app.starrocks.password=${STARROCKS_PASSWORD:}
app.starrocks.database=${STARROCKS_DATABASE:prolt_hes_db}
app.redis-url=${REDIS_URL:}

# Auth & OTP Configuration
# PARITY: Superadmin OTP backdoor and store fallback settings
app.auth.superadmin-otp-bypass.enabled=${SUPERADMIN_OTP_BYPASS_ENABLED:false}
app.auth.superadmin-otp-bypass.otp-value=${SUPERADMIN_OTP:}
app.auth.superadmin-otp-bypass.email=${SUPERADMIN_EMAIL:super.admin@probus.io}
app.auth.otp.allow-memory-fallback=${OTP_ALLOW_MEMORY_FALLBACK:false}

# Rate Limiting Headers
app.rate-limit.legacy-headers=${RATE_LIMIT_LEGACY_HEADERS:false}

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
