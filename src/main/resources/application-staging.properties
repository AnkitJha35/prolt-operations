# Staging environment profile configuration
app.node-env=staging
app.run-scraper=false
app.auth.superadmin-otp-bypass.enabled=false
app.auth.otp.allow-memory-fallback=true

# Observability
management.endpoint.health.show-details=always

# Security: Disable API documentation in staging / prod
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
