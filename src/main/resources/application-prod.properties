# Prod profile overrides
app.node-env=production
app.run-scraper=true
app.auth.superadmin-otp-bypass.enabled=false
app.auth.otp.allow-memory-fallback=false
logging.level.com.sense.prolt_operations=INFO
management.endpoint.health.show-details=never

# Disable Swagger UI and OpenAPI documentation in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
