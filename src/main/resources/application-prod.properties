# Prod profile overrides
app.node-env=production
app.run-scraper=true
app.auth.superadmin-otp-bypass.enabled=false
app.auth.otp.allow-memory-fallback=false
logging.level.com.sense.prolt_operations=INFO
management.endpoint.health.show-details=never
management.health.redis.enabled=true
app.security-state.provider=redis

# Security: Refresh cookies must be Secure in production
app.auth.refresh-token.cookie-secure=true

# Disable Swagger UI and OpenAPI documentation in production
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# CORS: Explicit allowlist required in production
app.cors-origins=${CORS_ORIGIN:https://dashboard.example.com,https://admin.example.com}
