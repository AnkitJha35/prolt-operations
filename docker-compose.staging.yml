name: prolt-local-staging

services:
  prolt-staging-postgres:
    image: postgres:16-alpine
    container_name: prolt-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prolt_staging}
      POSTGRES_USER: ${POSTGRES_USER:-prolt_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StagingPostgresPass2026!}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    networks:
      - prolt-staging-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-prolt_staging_user} -d $${POSTGRES_DB:-prolt_staging}"]
      interval: 3s
      timeout: 3s
      retries: 10

  prolt-staging-redis:
    image: redis:7-alpine
    container_name: prolt-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-StagingRedisPass2026!}"]
    volumes:
      - staging_redis_data:/data
    networks:
      - prolt-staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-StagingRedisPass2026!}", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  prolt-staging-app:
    image: prolt-operations:staging
    container_name: prolt-staging-app
    restart: "no"
    ports:
      - "127.0.0.1:8089:8080"
    networks:
      - prolt-staging-net
    depends_on:
      prolt-staging-postgres:
        condition: service_healthy
      prolt-staging-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DATABASE_URL: jdbc:postgresql://prolt-staging-postgres:5432/${POSTGRES_DB:-prolt_staging}?stringtype=unspecified
      POSTGRES_USER: ${POSTGRES_USER:-prolt_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StagingPostgresPass2026!}
      REDIS_URL: redis://:${REDIS_PASSWORD:-StagingRedisPass2026!}@prolt-staging-redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-StagingJwtSecretKeyForLocalTesting2026AtLeast32BytesLong!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-stagingadmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-stagingadmin@proltenergy.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-StagingAdminPass2026!}
      PUPPETEER_EXECUTABLE_PATH: ${PUPPETEER_EXECUTABLE_PATH:-/usr/bin/chromium}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:8089}
      NODE_ENV: staging
      RUN_SCRAPER: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  staging_postgres_data:
    name: prolt-staging-postgres-data
  staging_redis_data:
    name: prolt-staging-redis-data

networks:
  prolt-staging-net:
    name: prolt-staging-net
    driver: bridge
